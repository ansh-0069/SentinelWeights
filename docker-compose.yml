services:
  api:
    build:
      context: ./backend
    container_name: sentinelweights-api
    ports:
      - "8000:8000"
    # fully offline: no external network needed at runtime
    command: >
      sh -c "python -m samples.make_samples &&
             uvicorn app:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ./web
    container_name: sentinelweights-web
    ports:
      - "5173:5173"
    depends_on:
      - api
    environment:
      - API_TARGET=http://api:8000
